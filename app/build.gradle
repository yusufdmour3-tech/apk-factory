plugins { id 'com.android.application' }
android {
  namespace 'app.web.wrapper'
  compileSdk 34
  defaultConfig {
    applicationId (project.findProperty('appId') ?: 'app.web.wrapper')
    minSdk 21
    targetSdk 34
    versionCode 1
    versionName (project.findProperty('verName') ?: '1.0.0')
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' }
